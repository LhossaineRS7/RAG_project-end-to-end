[project]
name = "llm-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LhossaineRS7", email = "lhossaine.soussani@uit.ac.ma" }
]
requires-python = ">=3.13"
dependencies = [
    "elasticsearch==8.4.3",
    "google-genai>=2.28.0",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "sqlitesearch>=0.3.0",
    "tenacity>=9.1.4",
]

[project.scripts]
llm-rag = "llm_rag:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
